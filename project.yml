name: SRTStreamer
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.0.9
targets:
  SRTStreamer:
    type: application
    platform: iOS
    sources:
      - SRTStreamer
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
    info:
      path: SRTStreamer/Info.plist
      properties:
        CFBundleDisplayName: SRT推流
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: 需要使用摄像头采集视频进行推流
        NSMicrophoneUsageDescription: 需要使用麦克风采集声音进行推流
        NSLocalNetworkUsageDescription: 需要访问本地网络以连接推流服务器
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.srtstreamer
        PRODUCT_NAME: SRTStreamer
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
